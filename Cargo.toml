[workspace]
resolver = "2"
members = ["ffoie-engine", "ffoie-chat-server", "ffoie-protocol"]
default-members = ["ffoie-engine"]

# Shared deps used by two or more workspace members.
# Engine-only deps (wgpu, winit, egui, etc.) stay in ffoie-engine/Cargo.toml.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde"] }

# Release profile tuned for actual performance numbers.
# Use this profile when measuring FPS: `cargo run --release`.
# Defined here so it applies workspace-wide; per-crate Cargo.toml files do not repeat it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
