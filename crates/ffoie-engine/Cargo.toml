[package]
name = "ffoie"
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
# Cross-platform deps (native + web). WebGPU only — no WebGL2 fallback;
# the web build serves over HTTPS (or localhost) so secure-context-gated
# WebGPU is always available.
wgpu = "29.0.0"
winit = "0.30.8"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"
ktx2 = "0.5"
egui = "0.34"
egui-wgpu = "0.34"
# default-features disabled to drop `arboard` (clipboard), which doesn't build
# for wasm32. The chat TextEdit needs paste, so clipboard is re-enabled for
# native targets only in the `cfg(not(wasm32))` block below; on wasm32 the
# browser handles clipboard natively.
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# `std::time::Instant` panics on wasm32-unknown-unknown. web-time is a drop-in
# replacement that uses performance.now() on web and std::time on native.
web-time = "1"
# Protocol types shared with the chat server (pure data crate, wasm32-safe).
ffoie-protocol = { path = "../ffoie-protocol" }
# JSON serialization for chat wire format.
serde_json = "1"

# Native-only deps
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Re-enable egui-winit's clipboard (arboard) on native so Ctrl+V works in the
# chat input. Features unify with the cross-platform entry above; wasm32 skips
# this block, so arboard is never pulled into the web build.
egui-winit = { version = "0.34", default-features = false, features = ["links", "clipboard"] }
env_logger = "0.11"
pollster = "0.4"
# WebSocket client: cross-platform ewebsock (uses tokio-tungstenite on native,
# browser WebSocket on wasm32). The tokio feature enables the native path.
ewebsock = { version = "0.8", features = ["tokio"] }
# Tokio async runtime for the background WS thread (native only).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Fast PRNG for reconnect backoff jitter (no_std-safe, tiny dep).
fastrand = "2"

# Web-only deps
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# js-sys: JS standard library bindings (Math.random for wasm backoff jitter).
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "EventTarget",
] }
# Async sleep primitive for wasm32 (tokio::time::sleep is unavailable on wasm).
# TimeoutFuture wraps setTimeout as a Future.
gloo-timers = { version = "0.3", features = ["futures"] }
# ewebsock without tokio feature for wasm32 path.
ewebsock = "0.8"
