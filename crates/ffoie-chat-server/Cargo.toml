[package]
name = "ffoie-chat-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

# Middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config / env
dotenvy = "0.15"

# Sync primitives
parking_lot = "0.12"

# Small random (team assignment)
fastrand = "2"

# Workspace shared deps
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Protocol types
ffoie-protocol = { path = "../ffoie-protocol" }

[dev-dependencies]
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
