# Postgres lands in v1.1.x — the absence of a db service here is deliberate, not forgotten.

services:
  chat-server:
    build:
      context: .
      dockerfile: crates/ffoie-chat-server/Dockerfile
    ports:
      # Container always binds 8080 internally; host port is unique + overridable
      # via FFOIE_CHAT_PORT to avoid clashes with other local services.
      - "${FFOIE_CHAT_PORT:-47820}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - FFOIE_CHAT_BIND
      - FFOIE_CHAT_MOTD
      - FFOIE_CHAT_HEARTBEAT_SECS
      - FFOIE_CHAT_MAX_MSG_BYTES
      - FFOIE_CHAT_RATE_BURST
      - FFOIE_CHAT_RATE_REFILL_PER_SEC
      - FFOIE_CHAT_BROADCAST_CAPACITY
      - FFOIE_CHAT_SCROLLBACK_SIZE
      - FFOIE_CHAT_MAX_LAG_DISCONNECTS
      - RUST_LOG
      - RUST_LOG_FORMAT

  # Wasm engine bundle, served as static files via nginx.
  # The browser loads this from http://localhost:47821 and connects to the
  # chat-server via the host-mapped ws://localhost:47820/ws (baked into the
  # bundle at build time via FFOIE_CHAT_URL).
  #
  # NOTE: FFOIE_CHAT_URL is the URL the BROWSER uses, so it must reference the
  # chat-server's HOST port (FFOIE_CHAT_PORT), not the container-internal 8080.
  # If you override FFOIE_CHAT_PORT, set FFOIE_CHAT_URL to match.
  engine-web:
    build:
      context: .
      dockerfile: crates/ffoie-engine/Dockerfile.web
      args:
        FFOIE_CHAT_URL: ${FFOIE_CHAT_URL:-ws://localhost:47820/ws}
    ports:
      # Unique host port; override via FFOIE_WEB_PORT if 47821 is already taken.
      - "${FFOIE_WEB_PORT:-47821}:80"
    restart: unless-stopped
    depends_on:
      chat-server:
        condition: service_healthy
