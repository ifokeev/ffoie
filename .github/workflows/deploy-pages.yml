name: Deploy to GitHub Pages

# Triggered on every push to `main`, and manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. New pushes cancel an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Add wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown

      # Install trunk by downloading the release binary directly with
       # curl retries. We used to use `jetli/trunk-action@v0.5.0` here but
       # it would fail the whole deploy whenever the GitHub Releases CDN
       # 502'd — and when our deploy fails, GitHub's fallback Jekyll
       # workflow overwrites the live site with a generic page. Doing the
       # download ourselves lets us use curl's --retry-all-errors and pin
       # a specific known-good trunk version.
      - name: Install trunk
        run: |
          set -euo pipefail
          TRUNK_VERSION="0.21.14"
          INSTALL_DIR="${RUNNER_TEMP}/trunk-bin"
          mkdir -p "${INSTALL_DIR}"
          curl --retry 6 --retry-delay 10 --retry-all-errors -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${INSTALL_DIR}"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          "${INSTALL_DIR}/trunk" --version

      # Site layout:
      #   /        ← landing page (website/ contents copied to dist/ root)
      #   /web/    ← wasm game (trunk output, built from web-client/index.html)
      #
      # With a custom domain (CNAME file present) Pages serves from `/`, so
      # the game's public URL prefix is `/web/`. Without a CNAME, Pages
      # serves from `/<repo>/`, so the prefix becomes `/<repo>/web/`.
      - name: Build game (trunk)
        run: |
          if [ -f CNAME ]; then
            echo "CNAME found ($(cat CNAME)) — building for custom-domain root, game at /web/"
            trunk build --release --public-url "/web/" --dist dist/web web-client/index.html
          else
            echo "No CNAME — building for sub-path /${REPO}/web/"
            trunk build --release --public-url "/${REPO}/web/" --dist dist/web web-client/index.html
          fi
        env:
          REPO: ${{ github.event.repository.name }}

      # Drop the landing site's files at the dist root so `/` serves the
      # landing page and `/web/` keeps serving the game.
      - name: Copy landing site into dist
        run: |
          cp -R website/. dist/

      # Pass CNAME through to the artifact so GH Pages routes the custom
      # domain even when deploying via Actions (rather than "from a branch").
      - name: Copy CNAME into dist
        run: |
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
